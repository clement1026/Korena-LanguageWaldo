 wtt_japan.109.t:0 "일본 청혼하다 삼자 약속"
 wtt_japan.109.desc:0 "[From.GetNameDefCap]은 더듬이를 우리의 관심을 알아내기 위해 3개의 힘 사실 사이에 스스로 보냈습니다. [JAP_initiator.GetAdjective]. 그리고 [ITA_fascism.GetAdjective]들, [JAP_initiator.GetAdjective] 언쟁했다 그것은 우리의 노력에 대한 적대적인 세계 여론이 점점 더 높아지고 있다는 사실에 비추어 우리가 서로 지지한다. 반드시 해야한다."
 wtt_japan.110.desc:0 "[JAP_initiator.GetNameDefCap]은 더듬이를 우리의 관심을 알아내기 위해 3개의 힘 사실 사이에 스스로 보냈습니다. [JAP_initiator.GetAdjective]. 그리고 [GER_fascism.GetAdjective]들, [JAP_initiator.GetAdjective] 언쟁했다 그것은 우리의 노력에 대한 적대적인 세계 여론이 점점 더 높아지고 있다는 사실에 비추어 우리가 서로 지지한다. 반드시 해야한다. [GER_fascism.GetAdjective] 가졌다 충분한 단언 그들의 견해에 대한 지지."
