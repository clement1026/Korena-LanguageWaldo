l_korean:
 generic.8.t:0 "원자력의 대가"
 generic.8.d:0 "우리는 세계 최초의 핵 무기를 사용하여, 단단히 위치를 잡습니다 우리들을 끌고 현재의 무장 경주. 우리들의 엄청난 노력은 값을 지불했습니다, 그리고 또한 지금 세계는 선택지를 가지고 있지 않습니다 하지만 우리의 힘에는 놀랐습니다. 그들은 아마도 어느날 우리와 성냥할 것입니다, 하지만 우리는 가졌습니다 확신 그들이 나가성냥 우리들과. "
 generic.8.a:0 "우리의 적을 파운드화에서 가루로!"
 generic.9.t:0 "그림자 속 타인"
 generic.9.d:0 "다른 사람들은 사용했습니다 첫 번째 핵 무기, 배치합니다 그들을 딱딱하게 납 현재 팔들 인종. 우리도 모르게 최고의 노력, 우리들은 방어와 보복할 수단이 없는 좌파 입니다. 완전하게 나간 성냥. 우리 가진다 없는 선택권 하지만 다시 두배 우리의 노력 그리고 그들이 깡통을 촉발시키기 전의 다리 격차는 더구나 이것의 완전한 파괴  "
 generic.9.a:0 "이 프로그람은 얻을것입니다: 우리의 모든 남는 깡통"
 generic.10.t:0 "강력한 친구들"
 generic.10.d:0 "우리의 연합국 이용했습니다 그 세계의 첫번째 핵 무기, 단호하게 배치하는 중인 우리의 연합국은 현재의 팔 경주 납 속의. 그렇지만 우리는 가집니다 능가하는, 그 무기는 대가되었습니다 우리의 연합국에 의해서, 보장합니다 우리들의 능력 그 복수 해야 할 것이다 어떤 적 대가되다 원자의, 그들 스스로"
 generic.10.a:0 "예상치도 못한 수입"
 wtt_denmark.1.t:0 "얼음토지의 독립"
 wtt_denmark.1.d:0 "얼음토지 의회는 침공 후 통신이 두절되어 그 나라의 외교 사무를 통제했다. 이것은 점령이 끝날 때까지 임시로 안배된 것으로 여겨진다."
 wtt_denmark.1.a:0 "그들에게 좋은 행운"
 news.331.t:0 "얼음토지는 외교 사무를 통제한다"
 news.331.desc:0 "작가 파트너 소굴의 표식 결국 얼음토지 의회는 외교 정책을 이용해 얼음토지를 완전히 전복할 수 없었습니다. 주의가 다른 곳으로 옮겨졌을 때, 첫 번째 속편이 시작되자 왕이 소리쳤습니다."
 news.331.a:0 "중립은 소굴의 표식을 저장하지 못한다."
 wtt_britain.24.t:0 "맥도날드의 청혼 제안"
 wtt_britain.24.a:0 "좋은 사상이다."
 wtt_germany.44.t:0 "일본의 칭다오 교역 제안"
 wtt_germany.44.desc:0 "일본인은 공싱적으로 가졌습니다 잠재적 교역 제안을 가진 양당을 만족시킬 수 있는 미합중국 연락책. 그들은 청혼했습니다 청도를 우파스럽게 독일 손으로 다시돌다. 그리고 본 팔켄하우센이 행하는 도자기에서의 선교를 즉각적인 철회하는것을 위한 다시 도는것."
 wtt_news.7.a:0 "'단치히 혹은 전쟁'? 하! 사교 능력 미리내리는 다시."
 wtt_news.17.t:0 "일본 다시상점 독일인 규칙 트싱타오"
 wtt_news.17.desc:0 "그 일본인 정부 가졌습니다 결정된 응하기 최근 다시돌기 그들의 청도의 오래된 소수민족거주지를 위한 요구.\n\n효과적인 즉각적으로 독일인들은 시 한계 내부를 다시임명하였습니다 그리고 독일정부는 다시 이름을 지었습니다 그것의 예전이름 트싱타오"
 CHI_vietnam_JAP:0 "일본 육군"
 PRC_provoke_japan_korea:0 "한국"
 PRC_provoke_japan_manchuria:0 "만주"
 wtt_japan.1.t:0 "[From.GetNameDefCap]는 원한다 우리의 식민지로부터의 대군주함"
 wtt_japan.1.desc:1 "우리가 약해진 틈을 타 기회를 잡았던 [From.GetAdjective]이(가) 우리 식민지의 '질서 유지'에 '도움'을 주고자 제안을 했습니다. 그들이 논평하길, 우리의 본국은 함락되었고 이곳은 유지될 가능성이 없다는 것입니다.\n\n이것은 우리 식민지를 쥐락펴락하려는 술책일 테지만, 어떤 선택을 해야 할까요?"
 wtt_japan.1.a:0 "이것은 시간이다 동의하는 일본인 지배자 동쪽에서"
 wtt_japan.1.b:0 "그들은 해야한다 가져가는 그것을 강제로"
 wtt_japan.2.t:0 "[From.GetNameDefCap]는 부여하다 식민지의 대군주권한"
 wtt_japan.2.desc:0 "[From.GetNameDefCap] 조심스러움을 가진다 우리로부터 고려하는 '유지된 주문'그들의 식민지들, 그리고 가진다 결정 동의. 그들은 가진다 효과적인 이적 전채 통제 미합중국 위의."
 wtt_japan.2.a:0 "현명한 디시전"
 wtt_japan.3.t:0 "[From.GetNameDefCap]는 거절하다 대군주권한 식민지의"
 wtt_japan.3.desc:0 "[From.GetNameDefCap] 가진다 조심스럽게 고려하는 제의 '유지합니다 질서' 그들의 식민지들 안에서, 그리고 가졌다 결정 좆까."
 wtt_japan.3.a:0 "우리는 어떻게 냄비를 꺼내야 하는지 보겠습니다."
 wtt_japan.11.t: "아니오-공격적인 사실과 함께 [From.GetNameDef]"
 wtt_japan.11.desc: "[From.GetAdjective] 그리고 [Root.GetNameDef] 사이에서의 긴장이 최근 증가함에도 불구하고, [From.GetAdjective]은 가진다 우리에게 열린 거래 아니오-공격적인 사실. [USA.getName]으로부터의 이득은 투명하다, 하지만 [USA.getAdjective]에게 영향을 주는 무언가가 이득 [From.GetAdjective]으로부터 의지를 주다, 그리고 인지한다 우리의 의지는 이것을 후회하는 감동에서 산다."
 wtt_japan.11.a: "우리는 가진다 평화... 지금."
 wtt_japan.11.b:0 "그들을 거절한다 어느한 이익 가져간다 우선"
 wtt_japan.12.t:0 "[From.GetNameDefCap] 동의하다 아니요-공격적인 사실"
 wtt_japan.12.desc:0 "[From.GetNameDefCap]은 가진다 공식적인 동의 우리들의 아니오-공격적인 사실 주문."
 wtt_japan.12.a:0 "그들은 손바닥의 오른쪽안으로 연극합니다."
 wtt_japan.13.t:0 "[From.GetNameDefCap] 다시 융합된 아니오-공격적인 사실"
 wtt_japan.13.desc:0 "어떠한 이유로든지, [From.GetNameDef]는 아니오-공격적인 사실 주문으로부터 다시-연합 및 합동 교환 훈련을 가졌습니다."
 wtt_japan.13.a:0 "걔네들은 미합중국에 대항하여 표시하는중이냐?"
 wtt_japan.21.t:0 "[From.GetAdjective] 일반적인으로부터 계약을 체결한다."
 wtt_japan.21.desc:0 "[From.GetAdjective]은 기억해내다 그들의 좌파성향의 민간 고용인과 장군을 소환하고 미합중국의 우파성향의 장군과 민간 고용인을 대신 보내기로 비공식적인 망명에서 결정을 가졌습니다."
 wtt_japan.21.a:0 "[From.GetNameDef] 속에서 계획중인 무언가가 보인다."
 wtt_japan.22.t:0 "[Root.GetAdjective] 일반적인 거래가 체결되다."
 wtt_japan.22.a:0 "이것은 강화한다 우리가 잡고있는 넘어지다 [Root.GetNameDef]."
 wtt_japan.31.t:0 "야드 파운드법에 의한 가문의 동맥혈전색전증"
 wtt_japan.31.desc:0 "시간은 갔다 보다 운명 야드파운드법과 그의 가족. 유전적인 사회 상태 가지지 않습니다 장소 일본에서 우리가 지었다. 무엇 해야합니까 그들의 알맞다?"
 wtt_japan.31.a:0 "망명하다 그들!"
 wtt_japan.31.b:0 "그들의 머리들을 가지다!"
 wtt_japan.32.t:0 "야드파운드법에 의한 가족을 망명된"
 wtt_japan.32.desc:0 "[From.GetNameDefCap] 망명했었습니다 제국의 가족, 수여하다 거대한 요긴한 것 미합중국 속의 하다 그렇게! 그는 이제 막 도착했습니다 속의 [Root.GetNameDef], 그리고 자기도 모르게 그들의 망명은 그들의 유명세와 인민과 함께 그리고 병력 아직 좋다."
