l_korean:
 tfv_australia.1.t:0 "[From.GetAdjective] 청혼하다 약 아포레를 노래하다 계획"
 tfv_australia.1.d:0 "아포레를 노래하다 계획 가지다 주춧돌의 우리의 제지 보험 증권 대항하다 [JAP.GetNameDef] 한 때로부터 끝의 위대한 전쟁. 그러나, 자원이동의 가장 큰 함대에게 아포레를 노래하다 안에서 경우의 공격 이다 관계있는 지원부터 우리의 동맹국 안에서 [From.GetNameDef]. 함께 잠재적인 위협 대항하다 영국인 재산 안에서 멀리 동쪽 증가으로 의해 날, [From.GetAdjective] 높은 명령어 가지다 선물된 잠재력 새로운 책략, 그것 할 것이다 보다 호주 안에서 멀리 더욱 위대한 통제하다의 수비의 지역.\n\n그것은 들리다 계획, 그리고 유일한 질문 이다 이든 우리 믿는 그들은 깡통 제공하다 보안 우리 필요하다."
 tfv_australia.1.a:1 "호주 해야한다 제공하다 먼저 선의 수비 안에서 남동아시아."
 tfv_australia.1.b:0 "아포레를 노래하다 계획 의지 남다 처럼 그것 항상 가지다."
 tfv_australia.2.d:1 "[From.GetAdjective] 가지다 통과된 법 그것 의지 옮기다 통제하다의 모든 [From.GetAdjective] 식민지 주민 소지품 가까운 아포레를 노래하다 그리고 보르네오에게 [Root.GetNameDef].\n\n우리의 국가 소유의 안전 이다 마침내 안에서 우리의 소유하다 손들."
 tfv_australia.2.a:0 "우리의 의지는 실망하지 않는다"
 tfv_australia.3.t:0 "전략 조정을 [From.GetNameDefCap]이(가) 거절하다"
 tfv_australia.3.d:0 "불구하고 우리의 유효한 우려 약 생존능력의 아포레를 노래하다 계획, 우리의 제안들에게 바꾸다 그것 가지다 거절된 안에서 [From.GetAdjective] 감사원.\n이것 보인다 결과의 군사 보수주의 지배하는 [From.GetAdjective] 높은 명령, 하지만 사실 이다 그것 만약 우리의 공포 오다에게 지나가다, 우리 5월 가지다에게 얼굴 적 무력 위에 우리의 기슭."
 tfv_australia.3.a:0 "함께 혹은 함께하지 않더라도 [From.GetAdjective]의 지원, [Root.GetNameDef]의 의지는 높게 선다."
 tfv_australia.10.t:0 "[From.GetNameDefCap] 제안하다 보호 위한 우리의 균체들"
 tfv_australia.10.a:0 "[From.GetNameDefCap]의 의지는 다음의 처형자 [Root.GetAdjective] 흥미롭다 이 지역"
 tfv_australia.10.b:0 "[Root.GetAdjective] 영토의 의지는 남는다 [Root.GetAdjective]의 손 안에!"
 tfv_australia.20.d:0 "우리 가지다 길게 성가셔서 따라오는 성장의 국수주의적인 열렬 안에서 [From.GetNameDef], 그리고 그것 보인다처럼 그렇지만 날 가지다 마침내 오다 언제 그것 가지다 흐르다 밖 과거 그들의 소유하다 경계.\n인용하는 공유지 유산 처럼\"개척자 국가들,\"제안들 가지다 떠가는의 통합된 주의 오세아니아. 수사법 가지다 돌린 점점 더 공격적인 안에서 얼굴의 [Root.GetAdjective] 저항, 그러나.\n\n이제 정치적 추측 가지다 돌린에게 열다 적의, 그리고 [From.GetLeader] 공개적으로 요구 합병의 모든 [Root.GetAdjective] 영토에게 주의 [From.GetNameDef].\n만약 우리 다시녹다, 강압적인 침략 보인다 전적으로로 가능한."
 tfv_australia.21.d:0 "[From.GetAdjective] 가지다 접힌에게 우리의 최후통첩, 그리고 수락한다 그들의 새로운 신분처럼 지방의 [Root.GetNameDef]. 동안 [From.GetAdjective] [From.GetLeader] [From.GetAdjective]\"독립,\"이것 잠깐 표시하다 시작되는의 새로운 시대 위하여 오세아니아.\n\n [From.GetNameDef], 처럼 미국, 있다 지금 푹 삶은 애완용 강아지의 제국 그것 하다 아니다 가지다 우리의 이해관계에 심장."
 tfv_australia.51.a:0 "세계의 혁명이 기다리다!"
 tfv_australia.52.t:0 "간다 혼자서"
 tfv_south_africa.50.c:0 "왜 해야한다 우리 싸움 안에서 전쟁 반 세계 떨어져?"
 tfv_south_africa.51.d:0 "동안 [SAF.GetAdjective] 정부 남다 공식적으로 지지를 보내지 않는, 그것 가지다 허용된 큰 숫자의 그것의 시민들에게 참여 우리의 이유 처럼 자원봉사자."
 tfv_south_africa.52.d:0 "함께 싸움 안에서 스페인 넘어지게, 생존중인 자원봉사자의 전쟁 가지다 만드는 그들의 길 집. 그들은 가져오다 함께 그들의 가치있는 경험들 약 현대 전쟁요금."
 tfv_south_africa.60.d:0 "하고있다 해방된부터 잡고 있다의 그들의 식민지 주민 압제자, 인민의 [ANG.GetName] 서다 준비에게 가지고 가다 충전의 그들의 소유하다 운명. 그들은 가지다 형성된 잠정적인 정부 그리고 선발된 헌법. 유일한 물건 왼쪽에게 옮기다 권위부터 우리의 군사 총독에게 새로운 [ANG.GetAdjective] 정부의."
 tfv_south_africa.60.b:0 "우리 잘가라 그들의 함께 열다 무기!"
 tfv_south_africa.60.c:0 "상황 하다 아니다 허락하다 그것 그저 아직."
