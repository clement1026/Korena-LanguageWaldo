 tfv_new_zealand.1.desc:0 "혁명 가지다 성공 안에서 [From.GetNameDef]! 새로운 공산주의자 정부 가지다 가져간 충전 안에서 국가 그리고 회원가입을 모색하는 안에서 코민테른."
 tfv_new_zealand.1.b:1 "수용하는 그들의 할 것이다 유일한 열다 미국 위에게 가능한 충돌 안에서 먼 지역."
 tfv_canada.73.desc: "이후 하고있다 서명된 새롭게발견된토지법, 새롭게발견된토지의 주권 그리고 래브라도는쪽 주다 넘어지는쪽 우리의 동맹 [CAN.GetNameDef]. 그들 주 그것 이것 거래불가능한, 그들 하다 최소 지식 그것 우리 주다 경제적 compensation 위한 주다 위로 우리의 기반안에 구역."