 byz_triumph_for_italy:0 "이탈리아에서의 승리"
 byz_triumph_for_italy_desc:0 "이탈리아는 우리의 통제로 이미 가버렸습니다, 그리고 우리들은 다시통합해야 할 것입니다 그 제국을 영광스러운 의식! "
 byz_triumph_for_middle_east:0 "레반트를 위한 승리"
 byz_triumph_for_middle_east_desc:0 "그 레반트는 우리의 통제로 가버렸다, 그리고 우리는 해야한다 다시통합하기 그것을 제국으로 영광스러운 의식! 속에서"
 byz_triumph_for_egypt_and_tunis:0 "에깁트와 투니스를 위한 승리"
 byz_triumph_for_egypt_and_tunis_desc:0 "그 에깁트 그리고 투니스는 우리의 통제로 가버렸다, 그리고 우리는 해야한다 다시통합하기 그것을 제국으로 영광스러운 의식! 속에서"
 form_rattanakosin_kingdom:0 "라타나코신의 유산 강화"
 form_hre:0 "신성한 로마의 제국이 활기를 되찾다."
 form_scandinavia_category:0 "칼마르 연방 다시백화점"
 form_scandinavia_category_desc:0 "적봉된 모든 스칸디나비아의 영토와 함께, 이것은 시간입니다 그 다시백화점 그 영혼 칼마르 연방. 모든 스칸디나비아는 번영해야합니다 우리의 규칙 아래서"
 form_nordic_league_category:0 "노르드인 융합을 먼저주장"
 form_nordic_league_category_desc:0 "북유럽 국가들은 오랫동안 서로에게 어떠한 친밀감을 느꼈습니다. 이제 우리는 북유럽 구성국에 속한 모든 토지를 통제하고 있어, 그 연대감을 최고치로 끌어올릴 수 있습니다."
