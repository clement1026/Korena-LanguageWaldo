 LOW_SUPPLIES_TIPS:2 "따라오는 작용은 5월에 너를 이 현상을 해결하는것을 돕는다:\n\n - 밖으로 확산 혹은 재할당 줄이다 지역 소비를 위한 너의 단위.\n\n - 더 높이 지어라 기반구조물 그리고 확신을 만들어라 게다가 없는 철도길 병목 수도로부터.\n\n - 만역 너 가지다 충분한 트럭, 너는 모터화된 깡통 허브 너의 지역, 주다 그들을 확장된 보급 모자 그리고 거리\n\n만약 지역내의 보급이 베이징 배달된 바다로 인하여, 너는 또한 깡통:\n\n - 위의 성적 그 등급 그리고 해군 기초 출처 속 그리고 도착지방.\n\n - 만들어라 확신: 너는 가졌다 짓는 충분한 수송대."
