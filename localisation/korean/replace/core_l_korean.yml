 NAVAL_MISSION_NAME_SEARCH_AND_DESTROY_DESC:1 "순서 대책 위원회에게 적극적으로 seek out 그리고 사로잡다 적 함대들 안에서 선택된 지역(들)."
 NAVAL_MISSION_NAME_CONVOY_RAIDING:0 "호송대 습격중"
 NAVAL_MISSION_NAME_CONVOY_RAIDING_DESC:1 "순서 대책 위원회에게 습격 적 호송대들 안에서 선택된 지역(들)."
 NAVAL_MISSION_NAME_CONVOY_ESCORT:0 "호송대 호위대"
 NAVAL_MISSION_NAME_CONVOY_ESCORT_DESC:1 "순서 대책 위원회에게 호위대 호송대들 안에서 선택된 지역(들) 그리고 보호하다 그들에게 대항하는 적 습격."
 NAVAL_MISSION_NAME_INVASION:0 "수송/ 침략"
 NAVAL_MISSION_NAME_INVASION_DESC:1 "순서 대책 위원회에게 적극적으로 지원 병력 수송 그리고 침략 안에서 선택된§Y침략 명령§!.\n§G클릭§!에게 가능하게 하다 이것 사절단, 그때 §G클릭§! 위에 침략 화살 만약 너 가지다 그려진 하나의."
 NAVAL_MISSION_NAME_MINES_PLANTING:0 "기뢰부설"
 NAVAL_MISSION_NAME_MINES_PLANTING_DESC:2 "순서 대책 위원회에게 놓다 바다 지뢰 안에서 선택된 지역들. 가장 높은 잠재력 벌금 위하여 너의 적들이다:\n"
 NAVAL_MISSION_MISSED_REQUIREMENT_WARN_SHORE_BOMBARDMENT_DESC:0 "대책 위원회 의지 불가능에게 효율적으로 돕다 분열들 위에 기슭 선 안에서 전투 때문에 그것의 낮은 기슭 포격 가네프. 사려하다 더하는 배들 함께§Y무거운 총 공격§!에게 대책 위원회."
 NAVAL_MISSION_MISSED_REQUIREMENT_WARN_DEPTH_CHARGES_DESC:0 "대책 위원회 의지 믿기 힘든에게 손상 해병샌드위치. 사려하다 더하는 배들 함께 더욱§H깊이 요금§!."
 NAVAL_MISSION_MISSED_REQUIREMENT_WARN_SUB_SURFACE_DETECTION_DESC:0 "대책 위원회 의지 믿기 힘든에게 발견하다 해병샌드위치 동안 전투. 사려하다 더하는 더욱 배들 함께§Y수중 음파 탐지기들§!,§Y레이더들§! 또는 §Y비행기 투석기들§!."
 NAVAL_MISSION_MISSED_REQUIREMENT_WARN_SURFACE_DETECTION_DESC:0 "대책 위원회 의지 느린에 발견 잠재력 적들. 사려하다 더하는 더욱 배들 함께§Y레이더들§! 그리고§Y비행기 투석기들§!."
 NAVAL_MISSION_MISSED_REQUIREMENT_WARN_SPEED_DESC:0 "대책 위원회 평균의 속도이다 너무 낮은 그리고 의지 저해하다 그것의 얼룩빼기 재능. 사려하다 이전 느린 배들 또는 더하는 단식하는 사람 하나의."
 NAVAL_MISSION_MISSED_REQUIREMENT_WARN_SURFACE_VISIBILITY_DESC:0 "대책 위원회이다 너무 가시적인 그리고 깡통 쉽게 얼룩무늬의 그리고 또는 방지된으로 의해 적. 사려하다 사용 더 작은 또는 적게 장갑한 배들 함께 더욱 낮은 표면 시정."
 NAVAL_MISSION_SET_REASON_FOR_PLANTING_NO_SHIPS:0 "기뢰부설이다§R아니다 가능한§!, 왜냐하면 아무도 배들 안에서 너의 함대 가지다 재능에게 하다 그것!"
 NAVAL_MISSION_SET_REASON_FOR_SWEEPING_NO_SHIPS:0 "소해이다§R아니다 가능한§!, 왜냐하면 아무도 배들 안에서 너의 함대 가지다 재능에게 하다 그것!"
 NAVAL_MISSION_SET_REASON_FOR_NO_WAR:0 "너 반드시 be§R에 전쟁§! 안에서 순서에게 작동시키다 이것 사절단."
 NAVAL_MISSION_NAME_MINES_SWEEPING:0 "소해"
 NAVAL_MISSION_NAME_MINES_SWEEPING_DESC:2 "순서 대책 위원회에게 검색 그리고 중립화 바다 지뢰 안에서 선택된 지역들. 가장 높은 잠재력 벌금 그것 너 5월 고통받다 부터 적 지뢰이다:\n"
