 NAVAL_MISSION_NAME_PATROL_DESC:2 "순서 대책 위원회에게 순찰 함대들 지역의 수술.\n\n대책 위원회 깡통 오직 순찰 하나의 지역에 시간.\n이것 의지 시도에게 점 적 함대들 안에서 그것의 활동적인 지역. 레이더 그리고 공기 우월성 의지 돕다 그것 점 적 단식하는 사람.\n\n메모 그것 적 깡통 점 그리고 사로잡다 너 전에 너 점 그들에게."
