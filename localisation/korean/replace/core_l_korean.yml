 NAVAL_MISSION_NAME_TRAINING:1 "해군의 운동들"
 NAVAL_MISSION_NAME_TRAINING_DESC:3 "순서 대책 위원회에게 행하다 운동들 안에서 지역 인접한에게 가장 가까운 해군의 기반.\n이것 가지다 기회에게 손상 배들 넘어지게 시간.\n승무원 의지 아니다 얻다 경험 한 번 그들은 이르다 규칙적인 정도.\n너 의지 얻다§Y해군 경험§! 교육하는 동안.\n§Y자랑거리의 함대§!이다 적게 그럴듯한에게 얻다 안으로 사고.\n\n쥐기§H옮기다§! 그리고 클릭에게 가능하게 하다§H해군의 운동들§!까지 모든 배들 있다 완전히 훈련된."
 NAVAL_BTN_REMOVE_REGIONS:0 "§H제거하다 지역§!\n§G클릭§! 이것 버튼, 그떄 클릭 위에 지역 너 원하다에게 제거하다 위하여 현재의 선택된 함대.\n§Gright- 클릭§! 이것 버튼에게§R제거하다 모든 지역들§! 위하여 현재의 선택된 함대."
