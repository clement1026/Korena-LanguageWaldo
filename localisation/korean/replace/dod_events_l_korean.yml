l_korean:
 DOD_hungary.1.t:0 "절대 다수당이 없는 아리는 요구합니다 총선"
 DOD_hungary.1.desc:0 "하나의 해충이 싹이 피우다속에서의 연설 속에서, [HUN.GetLeader] 가졌습니다 요구된 그것 그의 오스트리아의 과목 있다 다시 돌아오도록 그의 규칙으로 다시회전하도록 허용가능. 화해의 표시 속에서, 어떻게 언제나 그 가졌다 매스컴의 관심 유명한 그것 그 호주 사람 해야합니다 그 다시 만들다 선택권 그들스스로 허용가능. "
 DOD_hungary.100.t:0 "절대 다수당이 없는 아리가 요구합니다 슬로바키아"
 DOD_hungary.107.t:1 "절대 다수당이 없는 아리가 대군주함을 요구합니다."