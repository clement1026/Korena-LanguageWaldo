 FIN_suomalainen_sosialismi_desc: "내전 도중 만네르헤임과 그 무리가 일으킨 반혁명적 참사들이 우리 사회의 전반에 자본주의의 혼란을 스며들게 하고 있습니다. 이대로 가만히 둘 수는 없습니다. 노동 계급을 완전히 해방시킬 방법을 찾아야만 합니다. "
 FIN_towards_a_red_government: "붉은 정부가 앞으로 나아가다 "
 FIN_towards_a_red_government_desc: "언제 그 노동자들의 혁명의 조수가 쓸었다 그 국가 1918년에, 그 프롤레타리아트들은 배신당했습니다 반동적인 강제의 만네르하임 그리고 그의 게르남자 연합국. 그 시간 왔다 복수하는 우리의 떨어진 동지들 그리고 마침내 생성한다 그 노동자들의 공화국 우리들이 항상 의미하던."
 FIN_the_second_finnish_civil_war: "그 두번째 완료한 민간 전쟁"
 FIN_the_second_finnish_civil_war_desc: "경험하다 확장 계급 의식 자라나는 프롤레타리아중에서 그리고 조직능력 그들의 지도층, 우리 마침내 쌓았습니다 자원들 넘어던지다 우리의 부르주아들 주인님들 한번 그리고 모두를 위해서"
