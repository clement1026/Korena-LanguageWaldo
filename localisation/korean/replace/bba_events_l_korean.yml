l_korean:
 bba_news.0.t:0 "국가 리그 종료"
 bba_news.0.a:0 "완벽히 예측하지 못하지 않았어"
 BBA_italo_ethiopian_war_events.01.a:0 "모든 의미를 필요로 의한"
 BBA_italo_ethiopian_war_events.02.a:0 "제거해라 침략자!"
 BBA_italo_ethiopian_war_events.03.a:0 "스케이트가 증가한다"
 BBA_italo_ethiopian_war_events.10.a:0 "이것은 우파적인 물건 하기위해"
 BBA_italo_ethiopian_war_events.11.a:0 "이것은 다치게 한다 그들의 전쟁 노력"
 BBA_italo_ethiopian_war_events.12.a:0 "너는 할 수 없습니다 진짜 믿는 아무나, 너 깡통?"
 BBA_italo_ethiopian_war_events.13.a:0 "이것은 그들에게 불다"
 BBA_italo_ethiopian_war_events.14.a:0 "우리는 조직해야한다 이 재산들"
 BBA_italo_ethiopian_war_events.15.a:0 "좋은"
 BBA_italo_ethiopian_war_events.16.a:0 "우리는 기다리고 보아야한다"
 BBA_italo_ethiopian_war_events.20.a:0 "투쟁은 계속되리라"
 BBA_italo_ethiopian_war_events.100.a:0 "그들은 이곳에 잘 왔다"
 BBA_italo_ethiopian_war_events.101.a:0 "한 주제는 적다 걱정할 대해"
 BBA_italo_ethiopian_war_events.102.a:0 "우리 시도해야한다 다른곳에서 그러더니"
 BBA_italo_ethiopian_war_events.110.a:0 "우리는 해야한다 동의, 지금"
 BBA_italo_ethiopian_war_events.111.a:0 "분류의 승리"
 BBA_italo_ethiopian_war_events.112.a:0 "우리의 의지는 가진다 싸움 평평한 더욱 단단한"
 BBA_italo_ethiopian_war_events.113.a:0 "만약 무력이 오직 언어다 그들이 말하다"
 BBA_italo_ethiopian_war_events.120.a:0 "우리는 집중해야한다 무엇 더욱 쉬운"
 BBA_italo_ethiopian_war_events.121.a:0 "이것 신호다 새로운 시작 아프리카를 위한"
 BBA_italo_ethiopian_war_events.122.a:0 "그 전쟁 들어간다 새로운 구절"
 BBA_italo_ethiopian_war_events.200.a:0 "만약 오직 그들이 할 수 있는 더욱 보다 말하다"
 BBA_italo_ethiopian_war_events.201.a:0 "우리 해야만 한다 짓다 위에 이것 밀기 위해서 그 적 [ROOT.GetName]의 밖"
 BBA_italo_ethiopian_war_events.202.a:0 "흐름이 도는 중이다"
 BBA_italo_ethiopian_war_events.203.a:0 "우리는 운전할 것이다 침략자들을 바다로"
 BBA_italo_ethiopian_war_events.204.a:0 "승리는 닫혔다 지금"
 BBA_italo_ethiopian_war_events.300.a:1 "어떻게 작은 믿음 그들이 가지다!"
 BBA_italo_ethiopian_war_events.301.a:1 "우리는 돌아야한다 전쟁의 조수에서!"
 BBA_italo_ethiopian_war_events.302.a:1 "불안감을 주는 소식!"
 BBA_italo_ethiopian_war_events.303.a:1 "반역자들!"
 BBA_italo_ethiopian_war_events.304.a:1 "비겁자 모든 그들의!"
 BBA_italo_ethiopian_war_events.305.a:1 "버릇없는!"
 BBA_italo_ethiopian_war_events.400.a:0 "하나의 최후통첩을 보내라, 요구하는 모든 지배하에 두다"
 BBA_italo_ethiopian_war_events.401.a:0 "이제 없다 점 저항"
 BBA_italo_ethiopian_war_events.402.a:0 "좋은, 움직이고 땅들을 점령하자"
 BBA_italo_ethiopian_war_events.403.a:0 "우리의 의지는 가졌다 이것을 하다 어려운 길"
 BBA_italo_ethiopian_war_events.500.a:0 "하나의 쓴 평화 그것있다"
 BBA_italo_ethiopian_war_events.501.a:0 "우리는 가졌다 아니 선택지"
 BBA_italo_ethiopian_war_events.502.a:0 "부끄러운"
 BBA_italo_ethiopian_war_events.503.a:0 "우리의 의지는 진압한다 그들"
 BBA_italo_ethiopian_war_events.510.a:0 "우리의 의지는 지불한다 그들의 거짓에!"
 BBA_ethiopia_balance_of_power_events.01.a:0 "우리는 그들을 패배시킬 것이다"
 BBA_ethiopia_balance_of_power_events.10.a:0 "아무것도 할게 없다, 이겠지요."
 BBA_ethiopia_balance_of_power_events.22.a:0 "그 소작농 일반 대중은 지도부를 할 수 없는 이다."
 BBA_ethiopia_balance_of_power_events.23.a:0 "그 정권 자라난다 더욱 안심하는 지나서 그 날."
 BBA_ethiopia_balance_of_power_events.24.a:0 "시간은 우리의 옆면 이다."
 BBA_ethiopia_balance_of_power_events.25.t:0 "정치적인 군대 사무관"
 BBA_ethiopia_balance_of_power_events.25.a:0 "이것은 그들 소유의 좋은"
 BBA_ethiopia_balance_of_power_events.26.a:0 "군대에서의 실력주의는 필수적인."
 BBA_ethiopia_balance_of_power_events.30.a:0 "다시 회전한 진정한 헤로"
 BBA_ethiopia_balance_of_power_events.51.a:0 "그 시골 필요로한다 모든 도움 그것 얻다 깡통"
 BBA_ethiopia_balance_of_power_events.52.a:0 "이것은 모두 좋은"
 BBA_ethiopia_balance_of_power_events.53.a:0 "순간을 통제하는것보다 더욱 중요한 얻다 많은 샅샅이 뒤지는"
 BBA_ethiopia_balance_of_power_events.54.a:0 "우리는 필요하다 하다 무엇"
 BBA_ethiopia_balance_of_power_events.55.a:0 "우리 필요하다 만드는 실험 여기"
 BBA_ethiopia_balance_of_power_events.56.a:0 "우리 수도화해야한다 이 기회 운전하는 집산화 가공하다 평평한 더 멀리에"
 BBA_ethiopia_exile_events.01.a:0 "[FROM.GetName]의 이유는 우리의 것이다."
 BBA_ethiopia_exile_events.04.t:0 "$RAJ_orde_wingate$ 다시부르다"
 ETH_destroyers_tt:0 "[ETH.GetName]는 받는다 5개의 파괴자를 [JAP.GetName]로부터"
 BBA_ethiopia_exile_events.52.t:0 "비밀스런 회합이 있는 방에서의 사교 능력"
 BBA_ethiopia_anti_colonialism_events.2.t:0 "[?global.african_supporting_country.GetNameDef] 요구한다 인저ㅇ [?global.african_revolt_country.GetNameDef]"
 BBA_switzerland.12.desc:0 "BBA_switzerland.12.desc"