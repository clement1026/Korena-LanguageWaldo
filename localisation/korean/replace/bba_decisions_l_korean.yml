 war_escalation_3_tt:1 "평평한 3\n §Y국가의 수준§!: 에티오피아가 5월달에 엠바고를 다시탐구합니다.\n §Y에티오피아§!: 국제노동자협회 평판 자란다, §Y다시탐구하는 엠바고§! 집중이 잠겨있지 않음."
 war_escalation_4_tt:1 "평평한 4\n §Y국가의 수준§!: 에티오피아가 5월달에 팔을 다시 탐구합니다.\n §Y이태리§!: 이탈리아의 일반인이 걱정합니다.\n §Y에티오피아§!: §Y팔 구입§! 집중이 잠겨있지 않습니다."
 war_escalation_5_tt:1 "평평한 5\n §Y국가의 수준§!: 에티오피아가 5월에 수에즈 종료를 다시탐구합니다.\n §Y이태리§!: 아프리카 육군이 낙심한다.\n §Y에티오피아§!: §Y수에즈 마무리짓기§! 집중이 잠겨있지 않음."
 war_escalation_6_tt:1 "평평한 6\n §Y국가의 수준§!: 에티오피아가 5월에 국제노동자협회 단체를 다시 탐구합니다.\n §Y이태리§!: 거주지가 불안해.\n §Y에티오피아§!: 군대의 모랄빵이 가속화됨. §Y국제노동자협회 단체§! 집중이 잠겨있지 않다."
