l_korean:
 MINIMIZE_EVENT:0 "최소한도를 위한 §G클릭§!. 행사는 위치합니다 §H행사 그리고 선택§!의 아래의 행사의 대기열에서"
 germany.4.t:0 "접속하다"
 germany.4.d:0 "반복되는 일어서는 호주 알아듣기 쉽게 보여주고 있습니다 그곳의 사람들의 길게 우리의 부유함과 연합되기. 이제 지금 시간은 행동하는것을 빼앗으십시오. 그리고 허락하십시오 그 사람들의 원하는 것을 만드십시오 나타내도록."
 germany.4.a:0 "어떻게 깡통이 모든 하나의 호주는 게르남자가 아니라고 말한다"
 germany.5.t:0 "반 제비갈매기 계약"
 germany.5.a:0 "한패가 되다"
 germany.5.b:0 "다시퓨즈"
 germany.6.t:0 "예술적인 여행 계약"
 germany.6.a:0 "한패가 되다"
 germany.6.b:0 "다시퓨즈"
 germany.11.t:0 "화염병-너무많은갈비살 조약"
 germany.11.a:0 "신호 조약."
 germany.12.t:0 "모스코우의 조약 신호"
 germany.12.a:0 "우수한."
 germany.13.t:0 "모스코우의 조약 다시젝트 "
 germany.13.a:0 "그들을 저주하세요!"
 germany.14.t:0 "문제 해결 지향 언어 그리고의 결혼상대 훈련"
 germany.14.d:1 "문제해결지향언어그리고는 우리의 것 이다. 하지만 동쪽의 부분은 떨어지다 아래로 그 [SOU.GetAdjective] 구체의 영향권 몰로토프-리벤트로프 조약에 따르면. 우리 물러나다 우리의 무력들 그리고 놓아주다 [SOU.GetAdjective]의 점령 이 영토? 실패에서 한다 그래서 했으면 좋겠다 만들아 우리의 조약 공백."
 germany.14.a:0 "네. 조약의 규정은 무조건 숭배되어야 한다."
 germany.14.b:0 "아니! 모든 문제 해결 지향 언어 그리고는 아버지의 토지에 소속감을 느낀다!"
 germany.15.t:0 "명예로운 독일 계약"
 germany.16.a:0 "우리는 바보에서 파시스트를 믿다."
 germany.22.a:0 "우수한."
 china.1.t:0 "루커우차오 사변"
 china.1.d:0 "일본 군대 최근 점심된 공격 전략적 마르코폴로교 그저 남쪽의 베이징, 하지만 그들 격퇴되다 우리의 용맹한 군대에 의해. 의심할 수 없다 그것은 우리를 미합중국에서 비난하기를 겨냥한 장소 오케스트라가 되었던 이벤트 그리고 무력중인 미합중국에로 항복 더 많은 영토 - 그저 비슷한 성경 사변 언제 일본인 침공된 남자추리아.\n\n어떻게 하다 우리 답변?"
 china.1.a:0 "우리 가졌다 닿다 부숴진 지점!"
 china.1.b:0 "우리 깡통 질병 여유가 되다 전쟁 함께 일본"
 china.2.t:0 "독일 탈퇴하다 조언가"
 china.2.d:0 "독일 가진 동굴된 안으로 일본 외교적 압력, 그리고 결정했다 철수 그들의 군사 조언단 우리 나라에서! 퐁 팔켄하우젠 약속하다 에서 요금좋다 저녁 그것 남자 보여주다 어느 전투 계획으로 일본 않다, 하지만 게르남자의 끝 지지한다 그것 확신한다 다치다 우리의 군대"
 china.2.a:0 "우리의 의지는 가졌습니다 만들다 하기 그들 없이"
 china.3.t:0 "불쌍한 중-일 관계"
 china.3.d:0 "우리의 악화되는 관계 함께 독일은 가진다 결과된 그들의 환불조치 모두의 우리의 군사적인 조언가 우리국가에서"
 china.3.a:0 "중국인 사무관의 의지는 핀란드의 무슨 그들이 시작된@"
 china.4.t:0 "군사 조언가 구금"
 china.4.d:0 "우리는 지금 독일과 전쟁중인 주에 있습니다, 모든 그들의 현재 우리나라의 독일인 조언가들 구금되었습니다. 폰 팔켄하우젠 그리고 일부 소수의 그들의 크로니들은 간신히 해냈습니다 우리의 꽉 잡음을 피했다, 그리고 에우로페로 다시회전했다."
 china.4.a:0 "좋은 제거된춤!"
 china.5.t:0 "모서리 더 이상"
 china.5.d:0 "붉은 군대 한번 살아남다 희망이 없어 보이는듯한 주에서, 하지만 긴 행진 여러번 년들 뒤 이래로, 조수간만의 차 천천히 변하다. 중요한 영토적 진보들과 함께, 우리의 역할은 아래강아지는 과거의 물건이다. 가진 싸움 너머 시간의 투쟁, 우리의 자포자기는 지금 미합중국의 뒤에 있다. 모택동 가지고 갔다 궤릴라 군대의 지도자 응딩이남자"
 china.5.a:0 "오래 살아라 인민 공화국이여!"
 china.6.t:0 "준비하다 공격 대항하는 공산주의자"
 china.6.d:0 "중국의 공산당의 붉은 군대의 기나긴 후퇴 이후 그들 가졌다 남자-나이먹은으로 다시모이다 그리고 세우다 그들 스스로를 산서. 그들의 계속되는 영향을 미치는 전환 그것 촌동네 인구 대항하다 미합중국 그리고 보다 지지 평의회 조합제안하다 만약 그들이 아마 성장하고 더욱 강력한 만약 좌파 그들이 가진 기기. 하지만 많은 포위하는 군벌들, 그럼에도 불구하고 우리 정부의 지원중,은 아마도 꺼리거나 우리의 효과적인 공격에서 필수적인 만족을 만들 수 없다.\n\n이것은 현재적으로 깨끗하지않다 붉은군대 아직 되찾거나 준비으로 미합중국의 얼굴 전투, 하지만 시간은 우리의 편이 아니다. 강화된 우리의 정치적인 힘을 위해서, 우리는 필요로한다 공산주의자에 대항하는 뇌졸중!"
 china.7.d:0 "그러나 우리들 탈출한다 전체적인 패배너머 기나긴 행진, 민족주의자들은 아직 계획중이지 않다 미합중국을 더욱 클 수 있도록 대립 없이. 우리의 간첩들 제안한다 그들은 삽입한다 무례한 대항하여 미합중국은 할 수 있다 약화 우리의 정치적 지지도 만약 그들이 시도하다 다시협정 더 이상.\n\n우리는 몰라 어떻게 저지르다 쿠오민탕이 밀다 미국을 후퇴하는 우파 지금. 시도하는 중이다 대립하는 그들 끌다 중요한 리스크. 만약 지역 전쟁군주들 가지다 집회 지지하는 공격, 우리의 기회는 오월에 날씬해질 것 입니다. 다른 손에는 다시 조약하는 지금 언제 우리 가졌다 마침내 멈춤 오월에 취사선택되지 않는다."
 china.8.d:0 "발견한다 우리의 계획 공격적임 통한 그들의 지역 간첩 그물망일하다, 그 중국의 공산당은 가졌다 함께 그려진 그들의 붉은 근데 더이상 산서로. 그럼에도 불구하고 그들은 틀렸음을 증명했다 미합중국의 기회에로 더 이상 약하된 그들의 숫자, 그것 보여준다 그것은 공산주의자가 더 이상 준비되지 않은 대면 미합중국, 그럼에도 불구하고 그것 선동 말한다. 일부 확장, 그 영향을 끼치는 일하다 우리의 효율위해"
 china.9.d:0 "우리의 기여 향한 붉은 군대 성공적, 적어도 지금. 불구하다 모으는 정보 공격에대한, 공산주의자 결정한다 대면 우리의 무력 그리고 잃다. 그들 가졌다 이제 강제로 철수 더 이상 그리고 많은 지역에 자라난 의심많은 그들의 능력 배달하다 그들의 실수 위로던지다 우리 정부"
 china.10.d:0 "부가지다 얻다 정보 대한 우리 계획 발사하다 무례한 이전의 손, 붉은 군대 전에 준비했다 그리고 대치했다 우리의 공격.  군사들 우리가 지휘했다 조립 여기 구역에서, 어디 우리의 힘 기반 약한곳, 은 불충분하다 공산주의자 강제의를 잡기 위한\n슬픈, 공격 돌아가다 미합중국 그리고 보다 붉은 군대의 다시덮는 서명 이후 그들의 기나긴 후퇴."
 china.11.d:0 "불구하고 우리의 최고의 영향들을 뒤로밀다 그 공격 지역적으로 조립된 군대들 지원하는 민족주의자 정부, 우리의 준비물들은 부족한 멈추다 그것. 함께 중요한 손실들, 우리는 가졌다 강제된 안으로 새로운 후퇴, 비록 더 짧은.\n\n맞닥뜨리는 민족주의자들 이전에 우리는 가졌다 충만히 회복된 5월 가졌다 실수. 우리의 웅장한 회복 안에 긴 행진 주입된 희망 안으로 우리의 지지자들, 하지만 지금, 씨앗들의 의심 가졌다 되었다 씨앗뿌려진."
 china.12.t:0 "쿠오민탕에 대항하는 승리"
 china.12.d:0 "도전하다 쿠오민탕 무례한 작동하다 우리의 맛. 지역적으로 조직된 군사 보내졌습니다 붉은 군대 닥치다 아직 준비되지않은 우리의 지식의 임박한 공격 그리고 패배했습니다, 모든 봉사하는 경고 가까운 전쟁군주들 공격한다 미합중국 깡통 비용적으로\n\n민족주의자들 가졌습니다 오직 입증된 그들이 낮게평가된 미합중국의 적 만큼, 그리고 그것은 한번 다시 떠오르는 인민공화국이다."
 china.12.a:0 "정치의힘은 자라난다 총들의 드럼통"
 china.13.t:0 "충돌 공동체주의 궤릴라들"
 china.13.d:0 "함께 둘 다 중국인 붉은 군대 가까스로 가진 이전의 무례함을 다시덮다, 우리의 적대적인 군사들 사전느끼다 가까운으로 경계 가진 다시 연소된 충돌. 조건속으로 지역 전쟁군주들 그리고 민병대는 우리가 가진 고려된 감동받은 더욱 군대 어디서나.\n\n그럼에도 불구하도 이것은 5월에 주지않는다 기회 충돌 공산주의자의 위협적인 존재가 한번 그리고 모두, 그것은 중요한 이념적인 승리 보여주기 위한 그들의 의지가 허가되지 않는 확장 더 이상일 것이었습니다."
 china.13.a:0 "우리는 지금 선을 추첨하는 필수품!"
 china.13.b:0 "우리는 할 수 없다 여유부리기 다른 분쟁"
 china.14.t:0 "패배 속의 [From.GetName]"
 china.101.t:0 "중국은 아래를 공격한다"
 china.102.t:0 "중국은 아래를 공격한다"
 china.202.t:0 "공산주의자들이 떠올랐다 [CHI_communist_state.GetName]에서"
 china.202.d:0 "[CHI_communist_state.GetName]에 성장하는 공산주의 지원이 한계점에 다다랐습니다. 정부 시설은 초과되고 반란군은 [Root.GetName]의 일부를 더 이상 고려 안하겠다고 선언했습니다. 우리는 효과적으로 공산주의 정권 [CHI_communist_state.GetName]의 모든 통제력을 잃게했습니다."
 china.203.t:0 "공산주의자들이 떠올랐다 [CHI_communist_state.GetName]에서"
 CHI_nanjing_tt:0 "§Y난징§!으로 수도를 움직여라"
 CHI_no_united_front:0 "없을 것 입니다. 협력 대항한 외부의 위협"
 france.33.title:0 "프랑스인 석방"
 france.34.title:0 "프랑스-영국의 연방 종말"
 finland.3.t:0 "지원을 요청하다 지느러미땅 스웨덴의"
 japan.1.d:0 "중국의 권위자들 주장하다 그 '부서지는 점' 되었다 도달된 안에서 우리의 '보증되지않은 공격성' 쪽으로 중국! 우리의 요구 위해 수리가 되었다 거절, 그리고 거기에있다 보고서 일본의 국민들 오다 아래로 공격 상해에서. 만약 우리가 필요하다 변명 다루다 결정적으로 함께 중국인들, 이것은 그것이다!"
 japan.1.a:0 "그들의 의지는 이것을 지불하기 위함입니다!"
 japan.2.d:0 "놀랍게도, 중국인 가졌다 조선을 뒤로가다 따라오는 소규모 접전 마르코폴로교. 그들 아래섰다 화나게하는 미합중국은 가파른 비용을 끌고간다, 그리고 가진 결정 확장적인 영토적 양보 그것 포함하는 북경 그리고 그것을 감싸는 지역들. 조금에 의해 조금, 중국은 우리의 것으로 변한다."
 japan.2.a:0 "전쟁의 의지는 기다리기 위함이다"
 japan.3.t:0 "경계 작은 충돌: 평의회 승리"
 japan.3.d:0 "러시아인들과 그들의 몽골리안 무릎 개들 탐지되었다 그 쌓아올림 우리의 군대들의 헤이룽장에서, 그리고 응답했다 함께 큰 급습 가로지르다 경계선 이전에 우리의 준비들이 되었다 완성된! 우리의 힘들은 나쁘게 망치로때려졌다 안에서 강렬한 작은싸움 그것 따랐다 이전에 그 두 옆들 분리결합!"
 japan.3.a:0 "어떻게 가능한 발생?"
 japan.4.t:0 "경계 작은 충돌: 일본인 승리"
 japan.4.d:0 "운이좋게도, 우리의 빠른-생각하는 지휘관들 잡았다 그들의 힘들을 안에서 집게 움직임. 우리는 가했다 심각한 손실들 위에 그들의 힘들 이전에 그들이 도망갔다 뒤로 가로질러 경계선."
 japan.4.a:0 "그것 가르칠 것이다 그들을!"
 japan.5.t:0 "평의회 철회"
 japan.5.d:0 "우리의 병력 증강을 포착한 이후, 소련은 현명하게도 즉시 병력을 인접 만주 국경과 바로 인접한 지역으로 철수시키는 선택을 취했습니다. 우리 군은 그들이 버리고 간 몇 개의 초소들을 일시적으로 접수하였습니다. 아이러니하게도, 이 결과는 그동안 러시아와 몽골이 내세워왔던 터무니없는 국경 분쟁에 종지부를 찍게 될 것입니다."
 japan.5.a:0 "보여주다 무력 은 모든 그것 가져감."
