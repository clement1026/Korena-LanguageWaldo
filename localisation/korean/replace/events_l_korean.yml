 usa.61.t:0 "[USA_congress_investment_state.GetName]에서의 상원의원이 지지를 제안하다"
 usa.61.desc:0 "[USA_congress_investment_state.GetName]에서의 고참 상원의원은 제안의 지원으로 정부에 접근했습니다. 그의 주는 심각한 투자부족으로부터 고통받고 있으며, 정부가 시작한 경제 자극 프로그램은 확실히 그가 특정 제안된 정부 정책 위에 그의 입장을 다시 생각하게 만들 것입니다. 그 상원의원은 몇몇 중요한 위원회 위에 앉아 있으며, 거래를 자를 수 있는 것으로 꽤나 유명합니다, 그의 투표는 양쪽 집에서 몇 개 더 가치 있는 것으로 만드는 중에."
 usa.62.desc:0 "[USA_congress_investment_state.GetName]에서의 상원의원들 접근했다 정부에, 제공하다 그들의 지원 대통령을 위해 교환으로 하나의 비공식 보증 그것 [USA_congress_investment_state.GetName] 될 것이다 장소의 새로운 탄약 공장 위해 군대. 그들은 주장하다 건설 하나의 공장 안에서 그 지역 만들 것이다 많은 일자리 그리고 제공하다 군대에 매우 필요되는 지원 안에서 점점 더 위험해지는 세계. 그 두 상원의원 또한 말하다 그들의 훌륭한 일 일하는 관계 함께 몇몇 영향력 있는 하원의원들."
 usa.63.t:0 "[USA_congress_investment_state.GetName]에서의 하원의원이 지지를 제안하다"
 usa.63.desc:0 "[USA_congress_investment_state.GetName]에서 온 국회 대표단 접근했다 정부에 가지고 여러 제안들 향상시키기 위해 그 주의 기반구조. 연방 자금 있어야 만들어진 이용 가능하게 하여 업그레이드 도로들과 다리들 안에서 위해 촉진 상업 사이의 주들. 그들은 또한 주목했다 그 지원으로부터 정부 안에서 이것 확실히 만들 것이다 그들을 더 기울이게 하여 지원하다 대통령 더 직접적으로 안에서 그의 의제."
