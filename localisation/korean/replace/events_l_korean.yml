 news.25.t:0 "리네란트의 다시군대화"
 news.25.d:1 "게르많은 가지다 리네란트 영토 내부에 배치된 무리, 가까운 프랑스인 경계, 베르사유 조약의 알아듣기 쉬운 폭력속에. 주민 인구 응원했다 게르남자 군인 위에, 프랑스와 영국의 사교 능력 반응이 그렇게 멀리 가다 조용할 동안.\n\n '이것은 이제 아닙니다 게르남자들 그들의 산책하다 소유한 등마당 안에서', 영국인이 관찰된 하나의 정치적 실황 방송 아나운서"
