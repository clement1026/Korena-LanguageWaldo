 britain.16.t:0 "왕 조지 V 사라지시다"
 britain.16.d:0 "통합된 왕국 그리고 영국의 지배권들 그리고 인도의 황제이신 조지 V 폐하는 합격했습니다. 그의 조용하고도 침착한 그리고 주제들의 헌신은 보았습니다 제국을 통해 함께 그 대전쟁 그리고 대공황. 그의 아들의 의지는 왕 에드워드 VIII의 역할로 추정됩니다. 하지만 이미 그의 의지는 너무나 독립적인 생각이라는 우려들이 있습니다. 스탠리 대머리이김 그리고 네빌 회의실누운은 그의 의지가 총리와 내각의 목적을 받아들이도록 준비했습니다"
 britain.16.a:0 "그는 5월에 평화속에서 휴식한다."
