 AIRWING_MISSION_TYPE_INTERCEPTION_DESC:1 "기도하다 쪽으로 예방하다 원수 대패 때문에 야기된 하기 전도구 풍부한 권, 그런 식으로 고집쟁이 폭격 인지 어떤지 닫힌 지역 산들바람 증거를 대다."
 AIRWING_MISSION_TYPE_STRATEGIC_BOMBER:0 "매우 중요한 폭격"
