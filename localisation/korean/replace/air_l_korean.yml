 AIRWING_MISSION_TYPE_TRAINING_DESC:1 "자산 맛보다 앞으로 이만큼 §H공기 날개§! 처럼 우물 §H대기 인생경험§!.\n너 의지 소멸하다 §H연료§! 또 번식 를 위험 의 §H분위기 우연§! 때 새어나오는 §H지도자 연습문제§!.\n§R를 허락하다 이런 소원 불구로 만들다 단지 전도구.§!"
 AIRWING_MISSION_TYPE_TRAINING_DESC_SHIFT_CLICK:0 "요새 §H교대근무§! 과 분명해지다 제자리에 허용하다 §H안내자 식§! 까지 §H산들바람 팔§! 가 전적으로 동맹하다"
