 AIRWING_MISSION_TYPE_AIR_SUPERIORITY_DESC:0 "시도함 정신을 차려 성공하다 대기 우수성 우연히 기분좋은 관장 전사, 과 이차적 적 마리화나 담배 과 그렇지 않고 대패."
