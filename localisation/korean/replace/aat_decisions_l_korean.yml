l_korean:
 ICE_drilling_for_oil_off_shore: "난바다 쪽으로 부는 기름과 가스를 위한 드릴"
 ICE_drilling_for_oil_off_shore_repeat_tt: "이 결정 깡통 입니다 다시 가져가겠습니다 다시 §Y180§! 일들 나중의"
 no_more_oil_tt: "§R기름 깡통 찾다 아니야 많이§!"
 no_more_oil_flag: "석유 지대 건조 실행"
 ICE_improve_the_viking_spirit: "숭배하는것 우리의 부조"
 ICE_already_improving_the_viking_spirit_flag: "이미 발전된 그 바이킹들의 영혼"
 ICE_a_new_yggdrasill: "현대적인 으그그드라실"
 ICE_a_new_yggdrasill_desc: "이제 인민들은 안다 그들의 엄청난 조상, 우리는 엄청년 계획을 건설하고 얼음의 경지의 땅을 개선하기 위해 애써서 미드가르드와 이그드라실의 전설과 맞먹을 수도 있습니다!"
 ICE_has_best_spirit_idea: "우리는 배부르게 존경받는 조상들을 먹었습니다."
 ICE_the_wisdom_of_odin: "오딘의 지혜"
 ICE_the_wisdom_of_odin_desc: "오딘은 지혜, 치유, 죽음, 사용료, 교수대, 지식, 전쟁, 전투, 승리, 마법, 룬 문자에 대한 광분과 제휴한 신 입니다. 그는 그의 엄청난 지혜를 그가 그의 눈을 미미스브룬느에서 마시기 위해 제안했을때 부여받았습니다. 그에게 현재, 미래, 과거에 대한 무한한 지식의 능력을 부여했습니다. 우리는 그의 정신을 구현하고 그의 유산을 미래에도 이어가도록 노력해야 합니다!"
 ICE_the_might_of_thor: "토르의 시제의 일치에 의해 메이에 준해서 종속절 안에서 씀 간접화법에 있어서 사실과 반대의 조건"
 ICE_the_might_of_thor_desc: "토르는 신입니다 천두의, 강화하고 보호한다 인류. 휘두른다 그의 망치를 묠니르, 그는 강타했고 구름은 천둥을 만들었다 그리고 우리의 군대는 친다 그 동일한 천둥과 공포를 우리의 야당한테로!"
 ICE_the_guidance_of_aegir_and_ran: "GUI춤의 에기와 란"
 ICE_the_guidance_of_aegir_and_ran_desc: "란과 에기르의 지도의 아래 바다의 인격화 그리고 그녀 요툰의 남편, 우리의 함선들 성취한다 우월성 북부 바다들 위에서. "
 ICE_the_ferocity_of_the_fenrir: "페로도시의 펜리설퍼"
 ICE_the_fertility_of_freya: "출생률의 프레이자"
 ICE_incite_communist_uprising_wales: "선동하다 하나의 반란 안에서 웨일스"
 ICE_incite_communist_uprising_ni: "선동하다 하나의 반란 안에서 북쪽의 이레땅"
 NORDIC_send_volunteers: "[FROM.GetAdjective]의 앞에 자원봉사자들을 보내다"