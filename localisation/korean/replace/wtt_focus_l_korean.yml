 JAP_exchange_the_exiles_desc:0 "우리가 이전의 보냈다 우리의 왼쪽-기울어진 사무관들 그리고 민간 하인 비공싱적인 만주속 망명안으로, 우리는 이제 환전한다 그들을 우리의 더욱 왼쪽-기울어진 하나들 대신. "
 JAP_open_up_the_universities:0 "대학을 열다"
