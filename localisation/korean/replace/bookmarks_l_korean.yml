l_korean:
 BM_HISTORY_TITLE:0 "역사 보고"
 GATHERING_STORM_NAME:0 "폭풍을 모으다"
 GATHERING_STORM_DESC:0 "어두운 시간이 오고있습니다. 유럽에서, 히틀러는 합병 정리된 그의 힘과 그의 차렷을 이제 점진적인 그려지는 독일 경계선 저편에. 이탈리아는 계속 승선하다 대담한 군사 모험에, 일본 제국이 아시아의 중국을 치기위해 아슬아슬하게 균형을 잡고 서있는 동안에. 거의 20년이 지났습니다 대전쟁의 종말 이래로, 하지만 세계는 그렇지만 가솔린에 대항하고 있습니다. 작은 불꽃이 모든것을 가져갈것 입니다."
 HITTING_FAN_NAME:0 "그 부채를 때리는 것"
 HITTING_FAN_DESC:0 "맞아, 그것은 오른쪽! 그것 우산 모음들은 다가오는것에 대해 사실 쓸모가 있다"
 ENG_GATHERING_STORM_DESC:0 "그럼에도 불구하고 통합된 왕국은 나타났습니다 대전쟁에서 승리를 거둔, 그 세워졌습니다 그것의 위대한 제국은 흔들어졌다 그것의 핵심애서. 그 국가의 경찰세대는 잃었습니다  3차원에서의 플랑드르 그리고 북부 프랑스, 불안함이 도처에 퍼지고 공동부유 그리고  거대한 빚이  누적될 동안\n\n신선한 기억의 마지막 전쟁과 함께, 그 국가는 이제 얼굴 그 다른 관점. 이것은 다가옵니다 증가되는 깨끗함 그것 우리시대의 평화는 없다. "
 FRA_GATHERING_STORM_DESC:0 "대전쟁의 참상에도 불구하고, 프랑스는 강건한 경제 덕택에 재건의 길을 걷고 있습니다. 하지만 대공황이 나라에 여전히 영향을 미치고 있고, 독일의 새 정권은 베르사유 조약에 명기되어 있는 전쟁 배상금을 내는 데 관심이 없습니다.\n\n조약이 체결되었을 때, 프랑스의 페르디낭 포슈 원수는 이 조약이 평화를 의미하는 것이 아닌 20년 간의 휴전 협정일 뿐이라는 유명한 말을 남겼습니다. 이제 그 20년이 다 되어 갑니다."
 GER_GATHERING_STORM_DESC:0 "독일은 이제 통일된 지 거의 10년이 되었습니다. 경제적으로 그 어느 때보다 강력하지만, 미래의 불경기 전망과 함께, 독일은 이 세계에서 새로운 목표를 찾아야 합니다. 새로 독립한 동유럽 국가들은 독일이 상당한 영향력을 가지고 있는 유럽 연합에 가입하려 하고 있습니다. 독일은 어두운 과거 때문에 어려움을 겪고 있지만 밝은 미래를 바라보고 있습니다."
 ITA_GATHERING_STORM_DESC:0 "떠오르는 파시즘과 함께, 이탈리아는 들어갔다 새로운 영광의 시대. 그들의 강제적인 현재로 에티오피아를 자라는 이탈리아의 식민적인 제국에 더하는 절차, 하지만 무솔리니의 야망은 거기서 멈추지 않는다.\n\n 자치령을 너머 지중해 국가들은 항상 이탈리아의 운명이였습니다, 그리고 그 TNO는 소지품의 모양을 훔쳐갔습니다 유럽에서. 조수의 파도가 바뀌는것이 찾아올때, 이탈리아는 그들의 산마루 혹은 쓸려가버린 위험에서 장소를 찾을것입니다."
 JAP_GATHERING_STORM_DESC:0 "일본 제국은 십자가도로 위에 서있습니다. 호쿠신론, 북부 확장 이론은 군대에 의해 선호받고 또한 시베리아의 진보를 촉구합니다. 난신론, 남부 확장 정책은 검남색과 동남아시아와 태평양을 타겟으로한 부유한 유럽인 집단에 의해 지지를 얻습니다.\n\n그런 다음, 당연합니다, 중국이 항상 있다. 일본은 붙잡는다 무서운 군인들, 하지만 그들의 산업들은 자원을 향해 굼주린다. 그리고 이제 시간이 소진되었습니다. 그러나 그 길 선택하는것?"
 SOV_GATHERING_STORM_DESC:0 "루스 시아파의 민간 전쟁 이후 그 가루들 안정되었을 때, 그 미합중국 소비에트 공화국 나타났다. 논쟁의 여지가 없는 위에 한때 루스 시아파 제국을 구성하던 것들의 지배자.\n \n회의 연합은 이제 마주합니다 서쪽으로부터 그 부활한 독일의 위협, 그리고 동쪽안의 호전적인 일본. 당연하게도, 계급 내의 내부적 위협들이 있습니다 맞서싸워야할 공산당."
 USA_GATHERING_STORM_DESC:0 "통합된 국가들은 뒤로 후퇴했습니다. 고립속으로 그 마지막 전쟁 그리고 즐기는 으르렁거리는 20년대의 경제적 번영의 끝. 그것은 가져왔다 그 극적인 끝 언제 그 나라가 꽉 붙잡혔습니다 위대한 우울증.\n\n미국의 해외에서의 전쟁에 관한 비-간섭 정책은 회사 위에 서다, 하지만 텐션이 올라갑니다 유럽과 아시아. 그 '위대한 중립적 위치에 있는 사람'은 5월에 그들 스스로 그들이 원했든 안했든 알빠아니고 대혼란 속에서 헬쑥함을 발견했다."
 ENG_BLITZKRIEG_DESC:0 "그럼에도 불구하고 통합된 왕국은 나타났습니다 대전쟁에서 승리를 거둔, 그 세워졌습니다 그것의 위대한 제국은 흔들어졌다 그것의 핵심애서. 그 국가의 경찰세대는 잃었습니다  3차원에서의 플랑드르 그리고 북부 프랑스, 불안함이 도처에 퍼지고 공동부유 그리고  거대한 빚이  누적될 동안\n\n신선한 기억의 마지막 전쟁과 함께, 그 국가는 이제 얼굴 그 다른 관점. 이것은 다가옵니다 증가되는 깨끗함 그것 우리시대의 평화는 없다. "
 JAP_BLITZKRIEG_DESC:0 "전쟁은 남동쪽에서 격렬한 분노를 내뿜고 있습니다. 제 아무리 일본이 이른 1939년에 약간의 패배로 고통받았음에도, 많은 중국인 영토가 일본인 통제 아해 있다. 긴장도는 유럽에서 상승합니다. 그리고 평의회 연방은 그들의 시점을 문제로부터 집중한다, 그들은 아시아의 전쟁에 개입하지 않는다. \n\n중국의 자원이 일본인의 손 안에 있을 때 소련과 거래하기 쉽다."
 CHI_GATHERING_STORM_DESC:0 "따라오는 혁명 입니다 해임시킨 마지막 청 황제들, 그 어린 중국인 민국 어려움을 겪었습니다 살아남기 위해서 전쟁군주들 규칙 매우 토지들 주위에. 국가의 심장속에서, 공산주의자들은 이미 설정했습니다 기반 지역 안에 연동합니다 산악 습곡. 그저 국경 넘어에, 일본인들은 이미 만들었습니다 인형정부 아래에서 그 마지막 중국인 황제 그리고 할 것입니다 도전 다시 통합시킵니다 그 국가 아래에서 그의 규칙.\n\n함께합니다 많은 적들 위협하는 그것, 그 장제스의 정부는 합니다 먹나 그 만들다 어려운 선택들 만약 그것 원하다 살아남고 중국의 위대한 규칙"
 PRC_GATHERING_STORM_DESC:0 "불과 2년 전, 살아남기 위해서 중국에서의 공산주의 축제는 전적인 전멸을 바라보았습니다. 그것들은 대장정이라고 알려진 서사시적인 여정과 약혼했습니다. 혹독한 행군과 근면을 견뎌낸 군대의 극히 일부만이 중국 내전에서 승리할 가능성은 희박합니다.\n\n그러나 시간이 지나면 인구는 공산주의 대의로 움직일 수 있고, 새로운 군대가 양성되고, 새로운 기지가 건설될 수 있으며, 때가 되면 최종 승리가 달성될 때까지 혁명적 투쟁이 다시 재개될 것입니다."
 CHI_BLITZKRIEG_DESC:0 "일본과의 전쟁이 시작된 지 2년, 장제스의 군대는 공세를 멈추고자 피 흘리며 분투하고 있습니다. 적들은 나라에서 가장 부유한 지역을 점령했습니다. 서방 민주 국들은 지원을 거의 보내오지 않았으며, 공산주의자들은 적과의 교전을 꺼리는 것 같습니다.\n\n전쟁이 더욱 확전될 위기에 있는 가운데, 이것이 최악인 것 같지는 않습니다. 하지만 일본의 공격은 이 나라의 광대함 앞에 느려졌고, 그들이 다른 방향으로 눈을 돌려 할 수도 있으며, 새로운 동맹 관계는 전세를 뒤바꿀 수 있을 지도 모릅니다..."