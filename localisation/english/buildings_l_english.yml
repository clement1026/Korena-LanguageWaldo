 fuel_silo_plural:0 "연료 격납고"
 fuel_silo_desc:0 "이 짓는 중은 제공합니다 너의 국가에 더 많은 §H연료§!를 쌓아 저장할 더 많은 방."
 dam: "댐"
 dam_plural: "댐들"
 dam_desc: "댐들은 상태에 추가적인 힘을 제공합니다, 향상시키는 산업 그리고 자원 출력."
